<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Login Test | Smart Parking System</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      max-width: 580px;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #fff; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 2rem; }
    .btn-container { display: flex; justify-content: center; margin-bottom: 1.5rem; }
    #token-box {
      display: none;
      margin-top: 1.5rem;
      text-align: left;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1.25rem;
    }
    textarea {
      width: 100%;
      height: 120px;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #475569;
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-family: monospace;
      font-size: 0.8rem;
      resize: none;
      margin-top: 0.5rem;
      margin-bottom: 1rem;
    }
    .copy-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      width: 100%;
    }
    .copy-btn:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Google Login Token Generator</h1>
    <p>Sign in with your Google account below to obtain a real ID Token for Postman testing.</p>

    <div class="btn-container">
      <div id="g_id_onload"
           data-client_id="20154548950-uhhvonq6a65a5bacd6096ckp35l0ofp1.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin"
           data-type="standard"
           data-size="large"
           data-theme="outline"
           data-text="sign_in_with"
           data-shape="rectangular"
           data-logo_alignment="left">
      </div>
    </div>

    <div id="token-box">
      <h3 style="font-size: 1rem; color: #10b981; margin-bottom: 0.25rem;">✓ ID Token Received!</h3>
      <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem;">Copy this token and use it in Postman body:</p>
      <textarea id="token-text" readonly></textarea>
      <button class="copy-btn" onclick="copyToken()">📋 Copy ID Token for Postman</button>
    </div>
  </div>

  <script>
    function handleCredentialResponse(response) {
      const idToken = response.credential;
      document.getElementById('token-text').value = idToken;
      document.getElementById('token-box').style.display = 'block';
    }

    function copyToken() {
      const textarea = document.getElementById('token-text');
      textarea.select();
      navigator.clipboard.writeText(textarea.value);
      alert('ID Token copied to clipboard! Now paste it in Postman.');
    }
  </script>
</body>
</html>
