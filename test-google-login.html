<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Login Test | Smart Parking System</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      max-width: 600px;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #fff; }
    p.sub { color: #94a3b8; font-size: 0.95rem; margin-bottom: 2rem; }
    .btn-container { display: flex; flex-direction: column; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    #token-box {
      display: none;
      margin-top: 1.5rem;
      text-align: left;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1.25rem;
    }
    textarea {
      width: 100%;
      height: 110px;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #475569;
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-family: monospace;
      font-size: 0.8rem;
      resize: none;
      margin-top: 0.5rem;
      margin-bottom: 1rem;
    }
    .copy-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      width: 100%;
      margin-bottom: 0.5rem;
    }
    .copy-btn:hover { background: #2563eb; }
    .test-api-btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      width: 100%;
    }
    .test-api-btn:hover { background: #059669; }
    .api-res-box {
      margin-top: 1rem;
      background: #111827;
      border-radius: 0.5rem;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.8rem;
      color: #a7f3d0;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Google Login Token Generator</h1>
    <p class="sub">Click the Google button below to sign in and get your real ID Token for testing.</p>

    <div class="btn-container">
      <div id="google-button"></div>
    </div>

    <div id="token-box">
      <h3 style="font-size: 1rem; color: #10b981; margin-bottom: 0.25rem;">✓ ID Token Received!</h3>
      <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem;">Copy this token or test login directly:</p>
      <textarea id="token-text" readonly></textarea>
      <button class="copy-btn" onclick="copyToken()">📋 Copy ID Token for Postman</button>
      <button class="test-api-btn" onclick="testBackendLogin()">🚀 Test Backend Login API Right Now</button>
      <div id="api-result" class="api-res-box"></div>
    </div>
  </div>

  <script>
    const CLIENT_ID = "20154548950-uhhvonq6a65a5bacd6096ckp35l0ofp1.apps.googleusercontent.com";

    function handleCredentialResponse(response) {
      if (response && response.credential) {
        const idToken = response.credential;
        document.getElementById('token-text').value = idToken;
        document.getElementById('token-box').style.display = 'block';
      }
    }

    window.onload = function() {
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({
          client_id: CLIENT_ID,
          callback: handleCredentialResponse,
          auto_select: false,
          cancel_on_tap_outside: true,
        });

        google.accounts.id.renderButton(
          document.getElementById('google-button'),
          {
            theme: 'filled_blue',
            size: 'large',
            type: 'standard',
            text: 'continue_with',
            shape: 'rectangular',
            width: 280
          }
        );
      }
    };

    function copyToken() {
      const textarea = document.getElementById('token-text');
      textarea.select();
      navigator.clipboard.writeText(textarea.value);
      alert('ID Token copied to clipboard! You can paste it in Postman.');
    }

    async function testBackendLogin() {
      const idToken = document.getElementById('token-text').value;
      const resBox = document.getElementById('api-result');
      resBox.style.display = 'block';
      resBox.innerText = 'Calling /api/v1/auth/google-login...';

      try {
        const res = await fetch('/api/v1/auth/google-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken })
        });
        const data = await res.json();
        resBox.innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        resBox.innerText = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
